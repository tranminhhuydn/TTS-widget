<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Listener</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Network Listener</h1>
        <p id="tabHost">Đang kết nối tab...</p>
      </div>
      <span id="stateBadge" class="badge">Đã tắt</span>
    </header>

    <section class="listen-panel">
      <button id="toggleListen" class="primary">Bắt đầu lắng nghe</button>
      <button id="clearList" class="secondary">Xóa danh sách</button>
    </section>

    <section class="files-section">
      <div class="section-heading">
        <h2>Danh sách file</h2>
        <span id="fileCount">0</span>
      </div>
      <div id="fileList" class="file-list">
        <div class="empty">Chưa có dữ liệu. Nhấn “Bắt đầu lắng nghe”, sau đó tải lại hoặc thao tác trên website.</div>
      </div>
    </section>

    <section class="viewer-section">
      <div class="section-heading">
        <h2>Nội dung file</h2>
        <span id="viewerType" class="muted">Chưa chọn</span>
      </div>
      <div id="viewer" class="viewer">
        <div class="empty">Chọn một file trong danh sách để xem.</div>
      </div>
    </section>
    <footer>Response body chỉ được giữ trong phiên trình duyệt hiện tại.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
