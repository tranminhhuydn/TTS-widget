<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTS-widget</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="popup">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">🔊</div>
      <div>
        <h1>TTS-widget</h1>
        <p>Đọc nội dung trang web</p>
      </div>
    </div>

    <button id="toggleButton" type="button">Đang kiểm tra…</button>

    <section class="appearance-setting" aria-label="Cài đặt giao diện">
      <label class="switch-row" for="darkModeToggle">
        <span class="switch-copy">
          <strong>Chế độ ban đêm</strong>
          <small>Áp dụng cho cửa sổ tiện ích và trang web</small>
        </span>
        <input id="darkModeToggle" type="checkbox">
      </label>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">
      Đang kiểm tra trạng thái trên tab hiện tại.
    </p>

    <div class="hint">
      Khi được kích hoạt, nhấn nút <strong>🔊 Đọc nội dung này</strong> ở góc dưới bên phải trang.
      Mở <strong>Cài đặt</strong> để chọn giọng đọc và điều chỉnh tốc độ.
    </div>
    <footer>Phiên bản 0.1.0 · Web Speech API</footer>
  </main>
</body>
</html>
