name: Build pronunciation dictionary
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-pronunciation-dict.yml"
      - "tts-subtitle-youtobe-chrome-extension/scripts/build-pronunciation-dict.py"
      - "tts-subtitle-youtobe-chrome-extension/tu_dien_phien_am_phat_giao_tay_tang.xlsx"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python tts-subtitle-youtobe-chrome-extension/scripts/build-pronunciation-dict.py
      - name: Commit generated dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tts-subtitle-youtobe-chrome-extension/tudien-phien-am-phat-giao-tay-tang.json
          git diff --cached --quiet || (git commit -m "Generate Tibetan Buddhist pronunciation dictionary" && git push)
