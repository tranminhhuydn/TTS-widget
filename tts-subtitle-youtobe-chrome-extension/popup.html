<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTS Subtitle YouTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>TTS Subtitle YouTube</h1>
    <label class="switch-row"><span>Đọc phụ đề</span><input id="enabled" type="checkbox"></label>
    <p id="status" role="status">Đang kiểm tra trang...</p>
    <label for="rate">Tốc độ đọc: <strong id="rateValue">1.0×</strong></label>
    <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
    <label class="switch-row"><span>Tự chọn giọng theo ngôn ngữ phụ đề</span><input id="autoLanguage" type="checkbox" checked></label>
    <label for="voices">Danh sách giọng đọc (giữ Ctrl để chọn nhiều)</label>
    <select id="voices" multiple size="6"></select>
    <label class="switch-row"><span>Luân phiên giọng đọc</span><input id="rotateVoices" type="checkbox"></label>
    <button id="stop" type="button">Dừng giọng đọc</button>
    <p class="hint">Bật CC trên YouTube. Nếu trình duyệt cung cấp track phụ đề có cue thời gian, extension sẽ ưu tiên dùng mốc bắt đầu/kết thúc của cue; nếu không, extension theo dõi caption đang hiển thị.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
